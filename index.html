<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Báo giá Siêu Di Động</title>
  <link rel="stylesheet" href="styles.css?v=20260818-1010">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1 id="priceDate">PS / Báo giá</h1>
        <div id="syncStatus" class="sync-status">Đang cập nhật...</div>
      </div>

      <label class="theme-toggle">
        <input id="themeToggle" type="checkbox">
        <span>Giao diện tối</span>
      </label>
    </header>

    <section class="toolbar">
      <input id="searchInput" class="search-input" type="search" placeholder="Tìm tên máy..." autocomplete="off">
      <div id="brandFilters" class="brand-filters"></div>
      <label class="compact-toggle">
        <input id="onlyPriced" type="checkbox" checked>
        <span>Chỉ hiện hàng có giá</span>
      </label>
    </section>

    <section id="priceGrid" class="price-grid">
      <div class="loading">Đang tải bảng giá...</div>
    </section>

    <footer class="footer">
      Giá máy được cập nhật thường xuyên. Vui lòng liên hệ xác nhận giá và tình trạng hàng trước khi đến cửa hàng.
    </footer>
  </main>

  <script src="config.js?v=20260818-1010"></script>
  <script src="app.js?v=20260818-1010"></script>
</body>
</html>
