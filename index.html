<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Báo giá Siêu Di Động</title>
  <link rel="stylesheet" href="styles.css?v=20260818-1130">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1 id="priceDate">PS / BÁO GIÁ NGÀY</h1>
        <div id="syncStatus" class="sync-status">Đang cập nhật...</div>
      </div>

      <label class="theme-toggle">
        <input id="themeToggle" type="checkbox">
        <span>Giao diện tối</span>
      </label>
    </header>

    <section id="toolbar" class="toolbar">
      <div class="search-wrap">
        <input id="searchInput" class="search-input" type="search" placeholder="Tìm tên máy..." autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
      </div>

      <label class="only-priced">
        <input id="onlyPriced" type="checkbox" checked>
        <span>Chỉ hiện hàng có giá</span>
      </label>
    </section>

    <section id="priceGrid" class="price-grid">
      <div class="loading">Đang tải bảng giá...</div>
    </section>

    <button id="floatingSearch" class="floating-search" type="button" aria-label="Tìm máy">⌕</button>

    <footer class="footer">
      <div class="footer-divider">
        <span class="footer-line"></span>
        <span class="footer-shield">✓</span>
        <span class="footer-line"></span>
      </div>

      <div class="footer-note">
        Thông tin chỉ dành cho nội bộ. Vui lòng không chia sẻ ra bên ngoài.
      </div>

      <div class="footer-credit">
        <span>© 2026 Tạo bởi <strong>haimmo</strong></span>
        <span class="footer-sep">|</span>
        <span>Internal Price System</span>
      </div>
    </footer>
  </main>

  <script src="config.js?v=20260818-1130"></script>
  <script src="app.js?v=20260818-1130"></script>
</body>
</html>
